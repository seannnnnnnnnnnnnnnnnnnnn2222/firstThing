<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IGNITION 시동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Michroma&display=swap">
<style>
:root{
  color-scheme:dark;
  --graphite:#0F1115; --panel:#22262D; --edge:#3A3F48;
  --steel-3:#6E7682; --steel-2:#AEB5BF;
  --text:#E6E9EE; --text-dim:#99A1AC; --engrave:#363C45;
  --ice:#8FE3FF; --ice-deep:#2AA8E0; --amber:#FFB547; --stall:#FF6B5E;
  --chrome:linear-gradient(162deg,#fbfcfd 0%,#d3d9df 16%,#8a939e 36%,#f1f3f6 50%,#9aa2ad 64%,#e2e6ea 80%,#7a828c 100%);
  --chrome-text:linear-gradient(180deg,#ffffff 0%,#e8ecf0 24%,#a4acb6 44%,#2c3138 50%,#8d959f 54%,#dfe3e8 70%,#ffffff 82%,#8a929c 100%);
  --brushed:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),linear-gradient(180deg,#2d3239 0%,#1b1e24 100%);
  --f-latin:"Michroma","Eurostile","Arial Black",sans-serif;
  --f-kdisp:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(1100px 520px at 50% -8%,rgba(143,227,255,.09),transparent 60%),var(--graphite);
  color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(40px + env(safe-area-inset-bottom,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}
.mono{font-family:var(--f-mono)}
.chrome-text{background:var(--chrome-text);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.col-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--steel-3);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-family:var(--f-latin);font-size:18px;letter-spacing:.22em}
.clock{font-family:var(--f-mono);font-size:12.5px;color:var(--text-dim)}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;padding:4px 11px;border-radius:999px;border:1px solid var(--edge);color:var(--steel-2);display:inline-flex;align-items:center;gap:7px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.warm{border-color:rgba(255,181,71,.55);color:var(--amber)}
.pill.warm::before,.pill.cruise::before{box-shadow:0 0 8px currentColor}
.pill.cruise{border-color:rgba(143,227,255,.55);color:var(--ice)}
.ghost{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:4px 11px;font-family:var(--f-mono);font-size:11.5px;color:var(--text-dim)}
.ghost:hover{color:var(--text);border-color:var(--steel-3)}

.strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.keyin{flex:1;min-width:260px;display:flex;align-items:center;gap:12px;text-align:left;border-radius:14px;padding:10px 16px;background:var(--brushed);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.keyin small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--ice);flex:none}
.keyin span{font-weight:500}
.keyin b{color:var(--ice);padding-inline:2px}
.sample{display:flex;align-items:center;gap:10px;border-radius:14px;padding:8px 8px 8px 14px;border:1px dashed var(--edge);font-size:13px;color:var(--text-dim)}
.sample button{border:0;border-radius:9px;background:var(--panel);padding:6px 10px;font-size:12.5px}

/* cockpit */
.cockpit{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:20px;margin-top:20px;align-items:start}
.panel{border-radius:20px;padding:16px;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.06)}

.rack{display:grid;gap:10px}
.dtag{position:relative;display:flex;align-items:center;border-radius:14px 30px 30px 14px;background:var(--chrome);color:var(--engrave);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 4px rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.45);transition:box-shadow .2s,transform .15s}
.dtag::before{content:"";position:absolute;left:13px;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:#15181d;box-shadow:inset 0 2px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.8)}
.dtag-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:11px 4px 11px 38px;color:inherit}
.dtag-main b{display:block;font-weight:600;font-size:14.5px;line-height:1.35;text-shadow:0 1px 0 rgba(255,255,255,.65);overflow-wrap:anywhere}
.dtag-main span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;margin-top:2px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.dtag-more{flex:none;width:40px;height:40px;margin-right:6px;border:0;border-radius:50%;background:rgba(0,0,0,.06);color:var(--engrave);font-size:18px;line-height:1}
.dtag-more:hover{background:rgba(0,0,0,.14)}
.dtag:hover{transform:translateX(2px)}
.dtag.loaded{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 4px rgba(0,0,0,.25),0 0 0 2px var(--ice),0 0 24px rgba(143,227,255,.5)}
.dtag.loaded .dtag-main span::before{content:"LOADED";font-size:9px;letter-spacing:.14em;color:#0b4a63;background:var(--ice);border-radius:4px;padding:0 5px;margin-right:6px}
.dtag.done{opacity:.5}
.dtag.done .dtag-main b{text-decoration:line-through}
.add-tag{width:100%;border:1.5px dashed var(--edge);background:transparent;border-radius:14px;padding:11px;color:var(--text-dim);font-weight:500}
.add-tag:hover{border-color:var(--ice);color:var(--ice)}
.note{font-size:12.5px;color:var(--text-dim);margin:0}
.nudge{font-size:12.5px;border-radius:12px;padding:8px 12px;border:1px dashed rgba(255,181,71,.5);color:#ffd79a;margin:0}
.empty{font-size:13px;color:var(--text-dim);text-align:center;padding:18px 8px;border-radius:14px;border:1px dashed var(--edge)}

.garage{margin-top:22px}
.g-add{display:flex;gap:6px;margin-bottom:10px}
.field-in{width:100%;min-width:0;min-height:42px;border-radius:11px;border:1px solid var(--edge);background:#14171c;padding:0 12px;font-size:15px}
.field-in:focus{border-color:var(--ice);outline:none;box-shadow:0 0 0 3px rgba(143,227,255,.15)}
.sq-btn{flex:none;border:1px solid var(--edge);border-radius:11px;background:var(--panel);padding:0 14px;font-weight:600;font-size:13.5px}
.g-list{display:grid;gap:6px}
.g-item{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 12px;border-radius:11px;background:#15181d;border:1px solid rgba(255,255,255,.05)}
.g-item p{flex:1;min-width:0;margin:0;font-size:13.5px;overflow-wrap:anywhere}
.mini-btn{flex:none;border:1px solid rgba(143,227,255,.4);color:var(--ice);background:transparent;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600}
.x-btn{flex:none;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--steel-3);font-size:16px}
.x-btn:hover{color:var(--stall)}

/* center */
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.stage{position:relative;width:100%;max-width:470px;aspect-ratio:1/1;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;border-radius:50%}
.stage::before{content:"";position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(143,227,255,.14),transparent 65%);filter:blur(24px);transition:opacity .4s}
.stage canvas,.stage svg.gauge{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg.gauge{pointer-events:none;overflow:visible}
.fallback{display:none;position:absolute;inset:27%;border-radius:50%;background:var(--chrome);box-shadow:0 0 0 12px #2a2e35,0 0 0 15px #9aa2ad,0 24px 50px rgba(0,0,0,.6),inset 0 -8px 20px rgba(0,0,0,.35);place-items:center;font-family:var(--f-latin);color:var(--engrave);font-size:clamp(14px,2.4vw,20px);letter-spacing:.18em;text-shadow:0 1px 0 rgba(255,255,255,.6);transition:transform .1s}
.stage.no3d canvas{display:none}
.stage.no3d .fallback{display:grid}
.stage.no3d.pressing .fallback{transform:scale(.96)}
.g-track{fill:none;stroke:#1b1f25;stroke-linecap:round}
.g-tick{stroke:#58606b}
.g-tick.major{stroke:#c7cdd4}
.g-lab{fill:#8d96a1;font-family:var(--f-mono);font-size:11px}
.read{margin-top:-8px}
.read .t{font-family:var(--f-mono);font-weight:600;font-size:clamp(40px,5vw,56px);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.read .s{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.18em;margin-top:8px;color:var(--steel-2)}
.read .s.warm{color:var(--amber)}
.read .s.cruise{color:var(--ice)}
.read .s.over{color:var(--stall)}
.now{font-family:var(--f-kdisp);font-size:clamp(22px,2.6vw,30px);line-height:1.25;margin:14px 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.msg{color:var(--text-dim);font-size:14px;margin:0 0 14px;max-width:44ch}
.hold{width:100%;max-width:320px}
.hold-bar{height:4px;border-radius:2px;background:var(--panel);overflow:hidden}
.hold-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b67a22,var(--amber));box-shadow:0 0 10px var(--amber)}
.hold-t{font-family:var(--f-mono);font-size:12px;color:var(--text-dim);margin-top:8px;min-height:1.5em}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.btn-chrome{border:0;border-radius:999px;padding:13px 24px;background:var(--chrome);color:var(--engrave);font-weight:600;font-size:14.5px;text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:inset 0 1px 0 #fff,inset 0 -3px 6px rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.5)}
.btn-chrome:active{transform:translateY(1px);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 3px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.5)}
.btn-glass{border-radius:999px;padding:12px 22px;background:rgba(143,227,255,.07);border:1px solid rgba(143,227,255,.5);color:var(--ice);font-weight:600;font-size:14.5px}
.btn-glass:hover{background:rgba(143,227,255,.14)}
.btn-danger{border-radius:999px;padding:12px 22px;background:rgba(255,107,94,.12);border:1px solid rgba(255,107,94,.55);color:#ffb3ab;font-weight:600}
.park-btn{margin-top:26px;border:1px dashed var(--edge);background:transparent;border-radius:999px;padding:10px 22px;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--text-dim)}
.park-btn:hover{border-color:var(--steel-2);color:var(--text)}

/* instruments */
.side{display:grid;gap:12px}
.engraved{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:14px 16px;background:var(--chrome);color:var(--engrave);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 5px rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.45)}
.engraved .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;opacity:.8}
.engraved p{margin:4px 0 0;font-weight:600;font-size:15.5px;line-height:1.4;text-shadow:0 1px 0 rgba(255,255,255,.65);overflow-wrap:anywhere}
.engraved p.dim{font-weight:500;opacity:.7}
.mod{border-radius:14px;padding:14px 16px;background:var(--brushed);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.mod .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--steel-3)}
.stall{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.stall .num{font-family:var(--f-mono);font-size:32px;font-weight:600;color:var(--stall);text-shadow:0 0 16px rgba(255,107,94,.4);font-variant-numeric:tabular-nums}
.stall button{border-radius:10px;border:1px solid rgba(255,107,94,.5);background:rgba(255,107,94,.08);color:#ffb3ab;padding:9px 12px;font-size:13px;font-weight:500}
.stall button:hover{background:rgba(255,107,94,.16)}
.odo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.odo small{display:block;font-size:11.5px;color:var(--text-dim)}
.digits{display:flex;gap:3px;margin-top:4px}
.digits span{width:24px;height:34px;display:grid;place-items:center;border-radius:5px;font-family:var(--f-mono);font-weight:600;font-size:19px;background:linear-gradient(180deg,#0b0c0f 0 49%,#16181d 51% 100%);border:1px solid #2e333b}
.digits.warn span{color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;text-align:center}
.stats b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--text-dim)}

/* log */
.lower{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;margin-top:20px}
.track{position:relative;height:18px;border-radius:5px;background:#12151a;overflow:hidden;margin-top:4px}
.seg{position:absolute;top:0;bottom:0;border-radius:3px;min-width:2px}
.seg.out{background:linear-gradient(180deg,#b8efff,#48bde8)}
.seg.busy{background:linear-gradient(180deg,#c6ccd4,#6e7682)}
.seg.live{animation:live 1.4s ease-in-out infinite}
@keyframes live{50%{opacity:.55}}
.seg.x{width:2px;min-width:2px;background:var(--stall);box-shadow:0 0 6px var(--stall)}
.seg.nowline{width:1px;min-width:1px;background:rgba(255,255,255,.5)}
.ticks{position:relative;height:16px;font-family:var(--f-mono);font-size:10.5px;color:var(--steel-3);margin-top:4px}
.ticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--text-dim)}
.coin{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;border:1.5px dashed var(--edge);color:transparent}
.coin.on{border:0;background:var(--chrome);color:var(--engrave);text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:0 0 0 2px #2a2e35,0 0 0 3px #aeb5bf,0 4px 10px rgba(0,0,0,.5)}
.day.today span{color:var(--text);font-weight:600}

/* parked */
body.parked .rack,body.parked .side,body.parked .lower{filter:saturate(.35) brightness(.7)}
body.parked .stage::before{opacity:0}

/* modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,4,6,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;border-radius:22px;padding:22px;background:radial-gradient(500px 200px at 50% 0%,#252a33,#15181d 70%);border:1px solid var(--edge);box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.modal h3{margin:0 0 14px;font-family:var(--f-kdisp);font-weight:400;font-size:24px;overflow-wrap:anywhere}
.modal .sub{margin:-6px 0 16px;color:var(--text-dim);font-size:13.5px}
.form{display:grid;gap:14px}
.form label,.flabel{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--steel-2)}
.form label em{font-style:normal;font-weight:400;color:var(--steel-3);margin-left:4px}
select.field-in{appearance:auto}
textarea.field-in{min-height:140px;padding:10px 12px;font-family:var(--f-mono);font-size:12px;resize:vertical}
.seg-ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg-ctl button{min-height:42px;border-radius:11px;border:1px solid var(--edge);background:#14171c;color:var(--text-dim);font-weight:500}
.seg-ctl button[aria-pressed="true"]{border-color:var(--ice);color:var(--ice);background:rgba(143,227,255,.08)}
.m-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.menu{display:grid;gap:6px}
.menu button{text-align:left;min-height:46px;border-radius:12px;border:1px solid var(--edge);background:#14171c;padding:0 14px;font-weight:500}
.menu button:hover{border-color:var(--steel-3)}
.menu button.del{color:var(--stall)}
.medal{width:128px;height:128px;border-radius:50%;margin:4px auto 16px;background:var(--chrome);display:grid;place-items:center;text-align:center;box-shadow:0 0 0 6px #2a2e35,0 0 0 8px #aeb5bf,0 14px 30px rgba(0,0,0,.6),inset 0 -6px 12px rgba(0,0,0,.3)}
.medal div{color:var(--engrave);text-shadow:0 1px 0 rgba(255,255,255,.7);line-height:1.1}
.medal b{display:block;font-family:var(--f-latin);font-size:34px}
.medal span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em}
.rcpt{font-family:var(--f-mono);font-size:13px;border-top:1.5px dashed var(--edge);border-bottom:1.5px dashed var(--edge);padding:12px 0;font-variant-numeric:tabular-nums}
.rcpt div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.rcpt div span:first-child{min-width:0;overflow-wrap:anywhere}
.rcpt div span:last-child{flex:none}
.rcpt .sub-l{color:var(--text-dim);padding-left:10px}
.warm-msg{font-family:var(--f-kdisp);font-size:20px;text-align:center;margin:16px 0 0;color:var(--ice)}

.toast{position:fixed;z-index:50;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:11px 18px;border-radius:12px;background:var(--chrome);color:var(--engrave);font-weight:600;font-size:14px;text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 14px 30px rgba(0,0,0,.6)}
.stamp{position:fixed;z-index:60;left:50%;top:44%;pointer-events:none;font-family:var(--f-latin);font-size:clamp(34px,6vw,60px);letter-spacing:.12em;padding:14px 28px;border-radius:16px;background:var(--chrome);color:var(--engrave);text-shadow:0 2px 0 rgba(255,255,255,.7);box-shadow:0 0 0 3px #2a2e35,0 0 0 5px #aeb5bf,0 0 60px rgba(143,227,255,.45),0 30px 60px rgba(0,0,0,.6);animation:stamp 1.1s ease-out forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8) rotate(-6deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(.96) rotate(-4deg)}32%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}}

@media (max-width:1100px){
  .cockpit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cockpit .center{grid-column:1 / -1;order:-1}
  .lower{grid-template-columns:1fr}
}
@media (max-width:680px){
  .cockpit{grid-template-columns:1fr}
  .cockpit .side{order:0}
  .keyin{min-width:0}
  .clock{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .seg.live{animation:none}
  .stamp{animation:fade 1.1s linear forwards;transform:translate(-50%,-50%)}
  @keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div style="display:flex;align-items:baseline;gap:14px">
    <span class="logo chrome-text">IGNITION</span>
    <span class="clock" id="clock"></span>
  </div>
  <div class="top-r">
    <span class="pill" id="pill">IDLE</span>

      <span class="legend"><span><i style="background:#8FE3FF"></i>결과물</span><span><i style="background:#AEB5BF"></i>잡무</span><span><i style="background:#FF6B5E"></i>스톨</span></span></p>

<div class="scrim" id="scrim" hidden data-act="close"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
/* ================= utils ================= */
const KEY='ignition.v1', HOLD=1.5, WARM=90;
const W=['일','월','화','수','목','금','토'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const TODAY=()=>ymd(new Date());
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):pad(m)+':'+pad(s);};
const hm=sec=>{const m=Math.round(sec/60);return Math.floor(m/60)+':'+pad(m%60);};
const hmK=sec=>{const m=Math.round(sec/60),h=Math.floor(m/60);return h?`${h}시간 ${m%60}분`:`${m}분`;};
const clock=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= state ================= */
function blank(){return {v:1,cue:{when:'의자에 앉으면',then:'시동 버튼 길게 누르기'},tasks:[],garage:[],sessions:[],stalls:[],park:{},current:null,timer:null,sound:true,sample:false};}
function seed(){
  const now=Date.now(), M=60e3, d=n=>ymd(addDays(new Date(),n));
  const S0=blank();
  S0.sample=true;
  S0.tasks=[
    {id:'t1',title:'mytt 파일럿 완료',micro:'클립스튜디오 열고 새 캔버스 만들기',est:60,kind:'out',date:d(0),done:false,spent:14*60},
    {id:'t2',title:'외주 견적 메일 회신',micro:'메일함에서 해당 메일 열기',est:15,kind:'busy',date:d(0),done:false,spent:0},
    {id:'t4',title:'연재 공지 문구 쓰기',micro:'메모장에 첫 문장만 쓰기',est:20,kind:'out',date:d(0),done:false,spent:0,carried:true},
    {id:'t3',title:'썸네일 3안 스케치',micro:'펜 쥐고 네모 3개 그리기',est:40,kind:'out',date:d(0),done:true,doneDate:d(0),doneAt:now-48*M,spent:52*60},
    {id:'p1',title:'11화 채색',est:90,kind:'out',date:d(-1),done:true,doneDate:d(-1),spent:130*60},
    {id:'p2',title:'세금 서류 정리',est:30,kind:'busy',date:d(-1),done:true,doneDate:d(-1),spent:25*60},
    {id:'p3',title:'11화 콘티',est:45,kind:'out',date:d(-2),done:true,doneDate:d(-2),spent:70*60},
    {id:'p4',title:'클라이언트 미팅 준비',est:30,kind:'busy',date:d(-4),done:true,doneDate:d(-4),spent:40*60},
    {id:'p5',title:'캐릭터 시트 수정',est:60,kind:'out',date:d(-5),done:true,doneDate:d(-5),spent:55*60},
    {id:'p6',title:'10화 업로드',est:20,kind:'busy',date:d(-5),done:true,doneDate:d(-5),spent:15*60}
  ];
  const sess=(s,e,t)=>({id:uid(),date:ymd(new Date(s)),start:s,end:e,sec:Math.round((e-s)/1000),kind:t.kind,taskId:t.id,title:t.title});
  S0.sessions=[sess(now-100*M,now-48*M,S0.tasks[3]),sess(now-44*M,now-36*M,{kind:'busy',id:'x',title:'메일 확인'}),sess(now-24*M,now-10*M,S0.tasks[0])];
  S0.stalls=[now-75*M,now-30*M];
  S0.garage=[{id:'b1',text:'세금계산서 발행'},{id:'b2',text:'포트폴리오 소개 문구 고치기'},{id:'b3',text:'다음 달 연재 주제 메모'}];
  S0.current='t1';
  return S0;
}
let S;
function load(){
  let raw=null; try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){try{S=Object.assign(blank(),JSON.parse(raw));}catch(e){S=null;}}
  if(!S||!Array.isArray(S.tasks)) S=seed();
  rollover();
}
let warned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){if(!warned){warned=true;toast('이 브라우저에선 저장이 안 돼요. 백업을 자주 해두세요.');}}}
const find=id=>S.tasks.find(t=>t.id===id);
const todays=()=>S.tasks.filter(t=>t.date===TODAY());
const nextTask=()=>{const t=todays().find(t=>!t.done);return t?t.id:null;};
const parked=()=>!!S.park[TODAY()];
const elapsed=()=>S.timer?Math.max(0,Math.floor((Date.now()-S.timer.startedAt)/1000)):0;
function rollover(){
  const td=TODAY();
  S.tasks.forEach(t=>{if(!t.done&&t.date<td){t.date=td;t.carried=true;}});
  if(S.timer&&!find(S.timer.taskId)) S.timer=null;
  const c=find(S.current);
  if(!c||c.done||c.date!==td) S.current=S.timer?S.timer.taskId:nextTask();
}
function phase(){
  if(parked()) return 'parked';
  if(S.timer) return elapsed()<WARM?'warm':'cruise';
  return S.current?'idle':'empty';
}

/* ================= sound ================= */
let AC=null;
function ac(){
  if(!S.sound) return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function sfxIgnite(){
  const a=ac(); if(!a) return; const t=a.currentTime;
  const len=Math.floor(a.sampleRate*1.1), buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
  const n=a.createBufferSource(); n.buffer=buf;
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
  const ng=a.createGain(); ng.gain.setValueAtTime(0,t);
  for(let k=0;k<6;k++){const s=t+k*.085; ng.gain.linearRampToValueAtTime(.22,s+.02); ng.gain.linearRampToValueAtTime(.02,s+.07);}
  ng.gain.linearRampToValueAtTime(0,t+.6);
  n.connect(lp).connect(ng).connect(a.destination); n.start(t); n.stop(t+1.1);
  const o=a.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(34,t+.48); o.frequency.exponentialRampToValueAtTime(120,t+.8); o.frequency.exponentialRampToValueAtTime(52,t+1.5);
  const lp2=a.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=420;
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t+.48); g.gain.exponentialRampToValueAtTime(.3,t+.7); g.gain.exponentialRampToValueAtTime(.0001,t+2.4);
  o.connect(lp2).connect(g).connect(a.destination); o.start(t+.48); o.stop(t+2.5);
}
function blip(freq,at,dur,type,vol){
  const a=ac(); if(!a) return; const t=a.currentTime+(at||0);
  const o=a.createOscillator(); o.type=type||'sine'; o.frequency.value=freq;
  const g=a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.18));
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+(dur||.18)+.02);
}
const sfxDone=()=>{blip(988,0,.14);blip(1319,.12,.35);};
const sfxStall=()=>blip(196,0,.16,'square',.08);
const sfxStop=()=>{blip(330,0,.12,'triangle',.15);blip(220,.1,.2,'triangle',.12);};

/* ================= timer actions ================= */
function ignite(){
  if(parked()||!S.current||S.timer) return;
  S.timer={taskId:S.current,startedAt:Date.now()};
  save(); sfxIgnite(); render(); toast('시동 걸림. 90초만 가보자.');
}
function stopTimer(quiet){
  if(!S.timer) return 0;
  const sec=elapsed(), t=find(S.timer.taskId), start=S.timer.startedAt;
  S.timer=null;
  if(t&&sec>=30){
    t.spent=(t.spent||0)+sec;
    S.sessions.push({id:uid(),date:ymd(new Date(start)),start,end:Date.now(),sec,kind:t.kind,taskId:t.id,title:t.title});
  }
  save();
  if(!quiet){ sfxStop(); toast(sec>=30?`${hmK(sec)} 기록했어요. 멈춘 것도 괜찮아요.`:'30초보다 짧아서 기록하지 않았어요.'); }
  return sec;
}
function complete(id){
  const t=find(id); if(!t) return;
  if(S.timer&&S.timer.taskId===id) stopTimer(true);
  t.done=true; t.doneDate=TODAY(); t.doneAt=Date.now();
  if(S.current===id) S.current=nextTask();
  save(); render(); sfxDone(); stamp('DONE');
  toast(`각인 완료. 오늘 ${todays().filter(x=>x.done).length}개째.`);
}
function loadTag(id){
  const t=find(id); if(!t||t.done||parked()) return;
  if(S.timer&&S.timer.taskId!==id) stopTimer(false);
  S.current=id; save(); render();
  if(matchMedia('(max-width:1100px)').matches) $('#stage').scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});
}

/* ================= gauge ================= */
const G={A0:135,SW:270,R:124,C:150};
const gp=(a,r)=>{const t=a*Math.PI/180;return [G.C+r*Math.cos(t),G.C+r*Math.sin(t)];};
function garc(a1,a2,r){const [x1,y1]=gp(a1,r),[x2,y2]=gp(a2,r);return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;}
(function buildGauge(){
  $('#gauge').innerHTML=`<defs>
    <linearGradient id="gAmber" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8a5c1a"/><stop offset="1" stop-color="#FFB547"/></linearGradient>
    <linearGradient id="gIce" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1f7fb0"/><stop offset="1" stop-color="#8FE3FF"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8FE3FF"/><stop offset="1" stop-color="#FF6B5E"/></linearGradient>
    <linearGradient id="gBezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f7f9"/><stop offset=".45" stop-color="#7d858f"/><stop offset=".55" stop-color="#2c3138"/><stop offset="1" stop-color="#c9ced4"/></linearGradient>
    <filter id="gGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <path d="${garc(G.A0-3,G.A0+G.SW+3,G.R+24)}" fill="none" stroke="url(#gBezel)" stroke-width="4" stroke-linecap="round"/>
  <g id="gTicks"></g>
  <path class="g-track" d="${garc(G.A0,G.A0+G.SW,G.R)}" stroke-width="11"/>
  <path id="gFillGlow" d="${garc(G.A0,G.A0+G.SW,G.R)}" pathLength="100" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="100 200" stroke-dashoffset="100" filter="url(#gGlow)" opacity=".55"/>
  <path id="gFill" d="${garc(G.A0,G.A0+G.SW,G.R)}" pathLength="100" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="100 200" stroke-dashoffset="100"/>
  <circle id="gTip" r="5" fill="#ffffff" opacity="0"/>`;
})();
let tickKey='';
function setTicks(labels){
  const key=labels.join('|'); if(key===tickKey) return; tickKey=key;
  let h='';
  for(let i=0;i<=18;i++){
    const a=G.A0+G.SW*i/18, major=i%6===0;
    const [x1,y1]=gp(a,G.R+11),[x2,y2]=gp(a,G.R+(major?20:16));
    h+=`<line class="g-tick ${major?'major':''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${major?2:1}"/>`;
    if(major){const [lx,ly]=gp(a,G.R+40);h+=`<text class="g-lab" x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle">${labels[i/6]}</text>`;}
  }
  $('#gTicks').innerHTML=h;
}
function setGauge(p,grad){
  p=Math.max(0,Math.min(1,p));
  const off=(100-p*100).toFixed(2);
  const f=$('#gFill'), fg=$('#gFillGlow');
  f.setAttribute('stroke-dashoffset',off); fg.setAttribute('stroke-dashoffset',off);
  f.setAttribute('stroke',`url(#${grad})`); fg.setAttribute('stroke',`url(#${grad})`);
  f.style.opacity=fg.style.opacity=p>0.002?'':'0';
  const [x,y]=gp(G.A0+G.SW*p,G.R), tip=$('#gTip');
  tip.setAttribute('cx',x.toFixed(2)); tip.setAttribute('cy',y.toFixed(2)); tip.setAttribute('opacity',p>0.002?'1':'0');
}

/* ================= live tick ================= */
let hold=0, holding=false;
function tick(){
  const n=new Date();
  $('#clock').textContent=`${n.getMonth()+1}월 ${n.getDate()}일 ${W[n.getDay()]}요일 · ${pad(n.getHours())}:${pad(n.getMinutes())}`;
  const ph=phase(), sec=elapsed(), cur=find(S.current);
  const pill=$('#pill');
  pill.className='pill '+(ph==='warm'?'warm':ph==='cruise'?'cruise':'');
  pill.textContent={warm:'WARM-UP',cruise:'CRUISE',idle:'IDLE',empty:'NO TAG',parked:'PARKED'}[ph];
  const sub=$('#rSub');
  if(ph==='warm'){
    setTicks(['0','30','60','90']); setGauge(sec/WARM,'gAmber');
    $('#rTime').textContent=fmt(sec);
    sub.className='s warm'; sub.textContent=`WARM-UP · ${WARM-sec}s LEFT`;
  }else if(ph==='cruise'){
    const estS=(cur?cur.est:30)*60, total=(cur?cur.spent||0:0)+sec;
    const e=cur?cur.est:30;
    setTicks(['0',Math.round(e/2)+'m',e+'m']);
    const over=total>estS;
    setGauge(total/estS,over?'gRed':'gIce');
    $('#rTime').textContent=fmt(sec);
    sub.className='s '+(over?'over':'cruise');
    sub.textContent=over?`CRUISE · 예상 ${e}분 넘김`:`CRUISE · 예상까지 ${Math.ceil((estS-total)/60)}분`;
  }else{
    setTicks(['0','30','60','90']);
    setGauge(holding?hold/HOLD*0.12:0,'gAmber');
    $('#rTime').textContent='00:00';
    sub.className='s';
    sub.textContent=ph==='parked'?'PARKED':ph==='empty'?'NO TAG LOADED':'READY';
  }
  // odometer
  const est=cur?cur.est:0, act=cur?Math.floor(((cur.spent||0)+(S.timer&&S.timer.taskId===cur.id?sec:0))/60):0;
  const dig=v=>String(Math.min(999,v)).padStart(3,'0').split('').map(c=>`<span>${c}</span>`).join('');
  const oe=$('#odoEst'), oa=$('#odoAct');
  const de=dig(est), da=dig(act);
  if(oe.dataset.v!==de){oe.innerHTML=de;oe.dataset.v=de;}
  if(oa.dataset.v!==da){oa.innerHTML=da;oa.dataset.v=da;}
  oa.classList.toggle('warn',cur&&act>est);
  // stats
  const td=TODAY();
  let out=0,busy=0;
  S.sessions.forEach(s=>{if(s.date===td){if(s.kind==='busy')busy+=s.sec;else out+=s.sec;}});
  if(S.timer){const t=find(S.timer.taskId);if(t){if(t.kind==='busy')busy+=sec;else out+=sec;}}
  $('#stFocus').textContent=hm(out+busy);
  $('#stOut').textContent=(out+busy?Math.round(out/(out+busy)*100):0)+'%';
  if(S.timer&&n.getSeconds()%15===0) drawLog();
}

/* ================= render ================= */
function kindLabel(t){return t.kind==='busy'?'잡무':'결과물';}
function render(){
  rollover();
  document.body.classList.toggle('parked',parked());
  $('#cueText').innerHTML=`${esc(S.cue.when)} <b>→</b> ${esc(S.cue.then)}`;
  $('#sample').hidden=!S.sample;
  $('#soundBtn').textContent=S.sound?'SOUND ON':'SOUND OFF';

  // rack
  const list=todays(), undone=list.filter(t=>!t.done), done=list.filter(t=>t.done);
  undone.sort((a,b)=>(b.id===S.current)-(a.id===S.current));
  const tomorrow=S.tasks.filter(t=>!t.done&&t.date>TODAY()).length;

  // garage
  $('#garageCount').textContent=S.garage.length||'';

    :`<p class="note">비어 있어요. 일하다 떠오른 건 여기 던져두면 머리가 가벼워져요.</p>`;

  // center
  const ph=phase(), cur=find(S.current);
  $('#nowTitle').textContent=ph==='parked'?'쉬는 시간':cur?cur.title:'태그를 꽂아주세요';

    empty:list.length&&!undone.length?'오늘 태그를 다 끝냈어요. 주차해도 충분해요.':'왼쪽 랙에서 태그를 눌러 슬롯에 꽂으면 시동을 걸 수 있어요.',
    idle:'버튼을 1.5초 누르고 있으면 시동이 걸려요. 90초만 하고 그만둬도 괜찮아요.',
    warm:'착수 구간이에요. 90초가 지나면 그만둬도 실패가 아니에요.',
    cruise:'엔진 걸렸어요. 흐름 탔으면 그대로 쭉.'
  }[ph];
  $('#holdBox').hidden=ph!=='idle';
  if(ph==='idle'&&!holding) $('#holdText').textContent='길게 누르기 · 키보드는 Space 길게';
  $('#ctrls').innerHTML=
    ph==='warm'||ph==='cruise'?`<button class="btn-glass" data-act="stop">시동 끄기</button><button class="btn-chrome" data-act="finish">완료 · 각인</button>`
    :ph==='idle'?`<button class="btn-glass" data-act="finish">바로 완료 처리</button>`
    :ph==='parked'?`<button class="btn-chrome" data-act="unpark">다시 시동 걸기</button>`
    :`<button class="btn-chrome" data-act="add">태그 만들기</button>`;
  $('#parkBtn').hidden=ph==='parked';

  // instruments
  const fm=$('#firstMove');
  fm.disabled=!cur;
  fm.innerHTML=cur?`<div class="k">FIRST 2 MIN · 첫 동작</div>${cur.micro?`<p>${esc(cur.micro)}</p>`:`<p class="dim">첫 동작이 비었어요 — 눌러서 적기</p>`}`
    :`<div class="k">FIRST 2 MIN · 첫 동작</div><p class="dim">태그를 꽂으면 여기에 새겨져요</p>`;
  const st=S.stalls.filter(ts=>ymd(new Date(ts))===TODAY()).length;
  $('#stallNum').textContent=pad(st);
  $('#stDone').textContent=done.length;

  drawLog(); drawWeek(); tick();
  if(window.__ign) window.__ign.refresh();
}

function drawLog(){
  const td=TODAY(), now=Date.now();
  const segs=S.sessions.filter(s=>s.date===td).map(s=>({s:s.start,e:s.end,k:s.kind,live:false}));
  if(S.timer){const t=find(S.timer.taskId);segs.push({s:S.timer.startedAt,e:now,k:t?t.kind:'out',live:true});}
  const stalls=S.stalls.filter(ts=>ymd(new Date(ts))===td);
  const base=new Date(); base.setHours(0,0,0,0);
  const hr=ts=>(ts-base.getTime())/3600e3;
  let h0=9,h1=18;
  segs.forEach(g=>{h0=Math.min(h0,Math.floor(hr(g.s)));h1=Math.max(h1,Math.ceil(hr(g.e)));});
  stalls.forEach(ts=>{h0=Math.min(h0,Math.floor(hr(ts)));h1=Math.max(h1,Math.ceil(hr(ts)));});
  h0=Math.max(0,h0); h1=Math.min(24,Math.max(h1,Math.ceil(hr(now))));
  const span=h1-h0, x=ts=>Math.max(0,Math.min(100,(hr(ts)-h0)/span*100));
  let h='';
  segs.forEach(g=>{h+=`<i class="seg ${g.k==='busy'?'busy':'out'} ${g.live?'live':''}" style="left:${x(g.s).toFixed(2)}%;width:${Math.max(.3,x(g.e)-x(g.s)).toFixed(2)}%"></i>`;});
  stalls.forEach(ts=>{h+=`<i class="seg x" style="left:${x(ts).toFixed(2)}%"></i>`;});
  if(hr(now)>=h0&&hr(now)<=h1) h+=`<i class="seg nowline" style="left:${x(now).toFixed(2)}%"></i>`;
  $('#track').innerHTML=h;
  const step=span>12?3:span>6?2:1;
  let t='';
  for(let k=h0;k<=h1;k+=step){const p=(k-h0)/span*100;t+=`<span style="left:${p.toFixed(2)}%;${p<3?'transform:none':p>97?'transform:translateX(-100%)':''}">${pad(k)}</span>`;}
  $('#ticks').innerHTML=t;
}
function drawWeek(){
  const now=new Date(), td=TODAY();
  let sum=0,h='';
  for(let i=-6;i<=0;i++){
    const d=addDays(now,i), k=ymd(d);
    const n=S.tasks.filter(t=>t.done&&(t.doneDate||t.date)===k).length; sum+=n;
    h+=`<div class="day ${k===td?'today':''}"><div class="coin ${n?'on':''}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일 ${n}개">${n||''}</div><span>${k===td?'오늘':W[d.getDay()]}</span></div>`;
  }
  $('#week').innerHTML=h; $('#weekSum').textContent=`${sum}개 각인`;
}

let pending=null,lastFocus=null;

}
function closeModal(){
  pending=null; $('#modal').hidden=true; $('#scrim').hidden=true; $('#modal').innerHTML='';

}
function confirmModal(title,body,ok,fn){

function stamp(txt){const s=document.createElement('div');s.className='stamp';s.textContent=txt;s.setAttribute('aria-hidden','true');document.body.appendChild(s);setTimeout(()=>s.remove(),1150);}

  restore(f){
    let d; try{d=JSON.parse(f.elements.namedItem('data').value);}catch(e){toast('백업 형식이 아니에요. 복사한 글자 전체를 붙여넣었는지 확인하세요.');return;}
    if(!d||!Array.isArray(d.tasks)){toast('태그 목록이 없는 데이터예요. 이 앱에서 복사한 백업인지 확인하세요.');return;}
    confirmModal('이 백업으로 덮어쓸까요?','지금 기록은 백업 내용으로 바뀌어요.','복원',()=>{S=Object.assign(blank(),d);save();render();toast('복원했어요.');});
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const s=el.dataset.act, i=s.indexOf(':');
  const act=i<0?s:s.slice(0,i), arg=i<0?undefined:s.slice(i+1);
  if(A[act]){e.preventDefault();A[act](arg,el);}
});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form&&F[f.dataset.form]){e.preventDefault();F[f.dataset.form](f);}});

/* ================= hold-to-ignite ================= */
const stage=$('#stage');
let holdStart=0, holdRAF=0;
function canHold(){return phase()==='idle';}
function pressStart(){
  if(!$('#modal').hidden) return;
  const ph=phase();
  if(ph==='empty'){toast('왼쪽 랙에서 태그부터 꽂아줘.');return;}
  if(ph==='parked'){toast('주차 중이야. 다시 시동 걸기를 먼저 눌러.');return;}
  if(ph!=='idle'){toast('이미 달리는 중. 멈추려면 시동 끄기.');return;}
  ac();
  holding=true; holdStart=performance.now(); stage.classList.add('pressing');
  cancelAnimationFrame(holdRAF);
  const step=now=>{
    if(!holding) return;
    hold=Math.min((now-holdStart)/1000,HOLD);
    $('#holdBar').style.width=(hold/HOLD*100).toFixed(1)+'%';
    $('#holdText').textContent=`시동 거는 중 · ${hold.toFixed(1)}s / ${HOLD}s`;
    setGauge(hold/HOLD*0.12,'gAmber');
    if(hold>=HOLD){holding=false;hold=0;stage.classList.remove('pressing');$('#holdBar').style.width='0%';ignite();return;}
    holdRAF=requestAnimationFrame(step);
  };
  holdRAF=requestAnimationFrame(step);
}
function pressEnd(){
  if(!holding) return;
  holding=false; stage.classList.remove('pressing');
  if(hold>0.1) $('#holdText').textContent='끝까지 누르고 있어야 걸려. 한 번 더.';
  hold=0; $('#holdBar').style.width='0%'; setGauge(0,'gAmber');
}
stage.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();pressStart();});
window.addEventListener('pointerup',pressEnd);
window.addEventListener('pointercancel',pressEnd);
stage.addEventListener('pointerleave',pressEnd);
stage.addEventListener('contextmenu',e=>e.preventDefault());
const typing=el=>el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return;}
  if(e.code==='Space'&&!e.repeat&&!typing(e.target)&&$('#modal').hidden&&(e.target===stage||e.target===document.body)){e.preventDefault();pressStart();}
  else if(e.code==='Space'&&e.repeat&&holding) e.preventDefault();
});
document.addEventListener('keyup',e=>{if(e.code==='Space')pressEnd();});
stage.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.repeat){e.preventDefault();pressStart();}});
stage.addEventListener('keyup',e=>{if(e.key==='Enter')pressEnd();});

/* ================= 3D ================= */
function init3D(){
  const cv=$('#ign');
  let renderer;
  try{ if(!window.THREE) throw 0; renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); }
  catch(e){ stage.classList.add('no3d'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(30,1,.1,100); cam.position.set(0,0,11.6);

  const ec=document.createElement('canvas'); ec.width=1024; ec.height=512;
  const g=ec.getContext('2d');
  const bg=g.createLinearGradient(0,0,0,512);
  bg.addColorStop(0,'#48505e'); bg.addColorStop(.42,'#101217'); bg.addColorStop(.58,'#06070a'); bg.addColorStop(1,'#232833');
  g.fillStyle=bg; g.fillRect(0,0,1024,512);
  g.filter='blur(5px)';
  const box=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
  box(0,64,1024,30,'#fff'); box(0,118,1024,8,'rgba(255,255,255,.55)');
  box(170,0,64,512,'rgba(255,255,255,.95)'); box(690,30,130,210,'#fff');
  box(410,372,320,20,'rgba(255,255,255,.75)'); box(900,0,34,512,'rgba(255,255,255,.45)');
  box(0,292,1024,12,'rgba(143,227,255,.95)'); box(520,180,40,120,'rgba(143,227,255,.6)');
  const et=new THREE.CanvasTexture(ec); et.mapping=THREE.EquirectangularReflectionMapping; et.encoding=THREE.sRGBEncoding;
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromEquirectangular(et).texture; et.dispose(); pm.dispose();

  function capTexture(){
    const c=document.createElement('canvas'); c.width=c.height=768;
    const x=c.getContext('2d'), m=384;
    x.fillStyle='#e9ebee'; x.fillRect(0,0,768,768);
    for(let r=2;r<m;r+=1.5){const v=200+Math.floor(Math.random()*50);x.strokeStyle=`rgba(${v},${v},${v+4},.55)`;x.lineWidth=1;x.beginPath();x.arc(m,m,r,0,Math.PI*2);x.stroke();}
    x.strokeStyle='#4a5058'; x.lineWidth=5; x.beginPath(); x.arc(m,m,m-44,0,Math.PI*2); x.stroke();
    x.fillStyle='#2f343b'; x.textAlign='center'; x.textBaseline='middle';
    x.font='52px Michroma, "Arial Black", sans-serif'; x.fillText('ENGINE',m,m-44);
    x.font='84px Michroma, "Arial Black", sans-serif'; x.fillText('START',m,m+44);
    x.font='26px "JetBrains Mono", monospace'; x.fillText('HOLD 1.5s',m,m+140);
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; t.center.set(.5,.5); t.rotation=Math.PI/2;
    return t;
  }
  const chrome=new THREE.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:.06});
  const steel=new THREE.MeshStandardMaterial({color:0x9aa1ab,metalness:1,roughness:.32,flatShading:true});
  const dark=new THREE.MeshStandardMaterial({color:0x2a2e35,metalness:.9,roughness:.42});
  const capTop=new THREE.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:.2});
  const glowMat=new THREE.MeshBasicMaterial({color:0x8fe3ff,transparent:true,opacity:.8});

  const pivot=new THREE.Group(); scene.add(pivot);
  const body=new THREE.Group(); body.rotation.x=Math.PI/2-.62; pivot.add(body);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(1.78,1.9,.42,128),dark); base.position.y=-.24; body.add(base);
  const knurl=new THREE.Mesh(new THREE.CylinderGeometry(1.66,1.66,.24,72),steel); knurl.position.y=-.02; body.add(knurl);
  const bezel=new THREE.Mesh(new THREE.TorusGeometry(1.44,.15,48,200),chrome); bezel.rotation.x=Math.PI/2; bezel.position.y=.1; body.add(bezel);
  const glow=new THREE.Mesh(new THREE.TorusGeometry(1.27,.035,16,200),glowMat); glow.rotation.x=Math.PI/2; glow.position.y=.12; body.add(glow);
  const well=new THREE.Mesh(new THREE.CylinderGeometry(1.24,1.24,.1,96),new THREE.MeshBasicMaterial({color:0x050608})); well.position.y=.08; body.add(well);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.13,.46,128),[chrome,capTop,chrome]); body.add(cap);
  const UP=.36, DOWN=.16; cap.position.y=UP;
  const setTex=()=>{if(capTop.map)capTop.map.dispose();capTop.map=capTexture();capTop.needsUpdate=true;};
  setTex();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(setTex);

  const size=()=>{const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();};
  new ResizeObserver(size).observe(stage); size();

  let tx=0,ty=0,mx=0,my=0,visible=true,flash=0;
  stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2;});
  stage.addEventListener('pointerleave',()=>{tx=ty=0;});
  new IntersectionObserver(es=>{visible=es[0].isIntersecting;}).observe(stage);

  const ICE=new THREE.Color(0x8fe3ff), AMB=new THREE.Color(0xffb547), WHITE=new THREE.Color(0xffffff), GREY=new THREE.Color(0x4a5058), tmp=new THREE.Color();
  let lastPhase=phase();
  window.__ign={refresh(){const p=phase();if(p!==lastPhase){if((p==='warm')&&lastPhase==='idle')flash=1;lastPhase=p;}}};

  let last=performance.now(), t=0;
  function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min((now-last)/1000,.05); last=now;
    if(!visible) return;
    t+=dt;
    const p=phase(), c=hold/HOLD;
    let target, op, exp=1.05;
    if(holding){ target=tmp.copy(ICE).lerp(AMB,Math.min(1,c*1.4)); if(c>.85) target.lerp(WHITE,(c-.85)/.15); op=.6+.4*c; }
    else if(p==='warm'){ target=tmp.copy(AMB); op=.7+.3*(reduce?1:(.5+.5*Math.sin(t*5))); }
    else if(p==='cruise'){ target=tmp.copy(ICE); op=.95; }
    else if(p==='idle'){ target=tmp.copy(ICE); op=.35+.35*(reduce?1:(.5+.5*Math.sin(t*1.8))); }
    else if(p==='parked'){ target=tmp.copy(GREY); op=.25; exp=.55; }
    else { target=tmp.copy(GREY); op=.5; }
    if(flash>0){ target=tmp.copy(target).lerp(WHITE,flash); op=1; flash=Math.max(0,flash-dt*1.6); }
    glowMat.color.lerp(target,Math.min(1,dt*10)); glowMat.opacity+=(op-glowMat.opacity)*Math.min(1,dt*10);
    const s=1+flash*.12; glow.scale.set(s,s,s);
    renderer.toneMappingExposure+=(exp-renderer.toneMappingExposure)*Math.min(1,dt*3);
    const capT=holding?DOWN:(flash>.6?DOWN:UP);
    cap.position.y+=(capT-cap.position.y)*Math.min(dt*18,1);
    mx+=(tx-mx)*Math.min(dt*4,1); my+=(ty-my)*Math.min(dt*4,1);
    const idle=reduce?0:Math.sin(t*.5)*.07;
    const shake=holding&&!reduce?(Math.random()-.5)*.014*c:0;
    const cruiseRumble=p==='cruise'&&!reduce?Math.sin(t*38)*.0015:0;
    pivot.rotation.y=mx*.3+idle+shake;
    pivot.rotation.x=my*.2+shake+cruiseRumble;
    renderer.render(scene,cam);
  }
  requestAnimationFrame(loop);
}

/* ================= boot ================= */
load(); save();
init3D();
render();
setInterval(tick,250);
setInterval(()=>{const d=$('#clock').dataset.day, td=TODAY(); if(d&&d!==td) render(); $('#clock').dataset.day=td;},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#modal').hidden)render();});
})();
</script>
